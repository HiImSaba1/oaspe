name: Build Papaki Standalone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify standalone output
        shell: bash
        run: |
          set -euo pipefail

          echo "=== BUILD INFO ==="
          node --version
          npm --version
          node -p '"Next " + require("./node_modules/next/package.json").version'

          echo
          echo "=== STANDALONE ==="

          if [ ! -d .next/standalone ]; then
            echo "ERROR: .next/standalone was not generated"
            exit 1
          fi

          echo "STANDALONE_FOUND=YES"
          du -sh .next/standalone

          if [ ! -f .next/standalone/server.js ]; then
            echo "ERROR: .next/standalone/server.js is missing"
            exit 1
          fi

          echo "SERVER_JS_FOUND=YES"

          echo
          echo "=== BUILD ID ==="
          cat .next/BUILD_ID

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          echo "=== COPYING STATIC ASSETS ==="

          mkdir -p .next/standalone/.next/static
          cp -a .next/static/. .next/standalone/.next/static/

          if [ -d public ]; then
            rm -rf .next/standalone/public
            cp -a public .next/standalone/public
          fi

          echo
          echo "=== DEPLOYMENT SIZE ==="
          du -sh .next/standalone

          echo
          echo "=== REQUIRED FILES ==="

          test -f .next/standalone/server.js
          echo "server.js: OK"

          test -f .next/standalone/package.json
          echo "package.json: OK"

          test -d .next/standalone/.next
          echo ".next: OK"

          test -d .next/standalone/.next/static
          echo ".next/static: OK"

          if [ -d .next/standalone/public ]; then
            echo "public: OK"
          else
            echo "public: MISSING"
            exit 1
          fi

      - name: Inspect native modules
        shell: bash
        run: |
          set -euo pipefail

          echo "=== NATIVE .NODE MODULES ==="

          find .next/standalone \
            -type f \
            -name '*.node' \
            -print | sort || true

          echo
          echo "=== SWC NATIVE MODULES ==="

          SWC_MODULES="$(find .next/standalone -type f -name '*swc*.node' -print || true)"

          if [ -n "$SWC_MODULES" ]; then
            echo "$SWC_MODULES"
            echo
            echo "WARNING: SWC native modules are present."
          else
            echo "No SWC native .node modules found."
          fi

      - name: Create deployment archive
        shell: bash
        run: |
          set -euo pipefail

          COMMIT="${GITHUB_SHA::7}"
          ARCHIVE="oaspe-papaki-standalone-${COMMIT}.tar.gz"

          echo "Creating: $ARCHIVE"

          tar \
            -C .next/standalone \
            -czf "$ARCHIVE" \
            .

          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo
          echo "=== ARCHIVE ==="
          ls -lh "$ARCHIVE" "${ARCHIVE}.sha256"

          echo
          echo "=== SHA256 ==="
          cat "${ARCHIVE}.sha256"

          echo
          echo "=== VERIFY TAR ==="
          tar -tzf "$ARCHIVE" >/dev/null
          echo "Archive verification: OK"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload Papaki artifact
        uses: actions/upload-artifact@v4
        with:
          name: oaspe-papaki-standalone-${{ github.sha }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 7