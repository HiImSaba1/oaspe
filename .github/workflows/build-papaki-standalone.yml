name: Build Papaki Standalone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Diagnose Next.js build output
        shell: bash
        run: |
          set -euo pipefail

          echo "=== BUILD INFO ==="
          node --version
          npm --version
          node -p '"Next " + require("./node_modules/next/package.json").version'

          echo
          echo "=== WORKING DIRECTORY ==="
          pwd

          echo
          echo "=== NEXT CONFIG ==="
          cat next.config.ts || true

          echo
          echo "=== .NEXT DIRECTORY ==="
          if [ -d .next ]; then
            du -sh .next
            find .next -maxdepth 3 -type d | sort
          else
            echo "ERROR: .next does not exist"
          fi

          echo
          echo "=== BUILD ID ==="
          if [ -f .next/BUILD_ID ]; then
            cat .next/BUILD_ID
            echo
          else
            echo "MISSING: .next/BUILD_ID"
          fi

          echo
          echo "=== SEARCH FOR STANDALONE ==="
          find . -type d -name standalone -print 2>/dev/null || true

          echo
          echo "=== SEARCH FOR GENERATED SERVER.JS ==="
          find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -name server.js -print

          echo
          echo "=== REQUIRED SERVER FILES ==="
          if [ -f .next/required-server-files.json ]; then
            head -c 5000 .next/required-server-files.json
            echo
          else
            echo "MISSING: .next/required-server-files.json"
          fi

          echo
          echo "=== DIAGNOSTIC COMPLETE ==="